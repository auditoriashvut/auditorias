<style>

.huella{font-family:"Courier New",monospace;font-weight:bold;letter-spacing:.06em}

.tw{overflow-x:auto}

.nav{position:sticky;top:var(--barh,58px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;
  padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.nav button{transition:none!important;flex:0 0 auto;border:0;background:transparent;min-height:40px;padding:0 14px;color:var(--muted);font-weight:bold;border-radius:8px}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--muted)} .kpi b{font-size:24px;font-variant-numeric:tabular-nums}

.barra{height:10px;border-radius:999px;background:var(--sunken);min-width:80px;overflow:hidden}

.barra i.bajo{background:var(--bad)}
.det{width:100%;display:flex;flex-direction:column;gap:8px;background:var(--sunken);border-radius:8px;padding:12px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-weight:bold}
.plan{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
</style>

<body>
<header class="bar">
  <div class="inst"><small>Universidad del Tolima · HVUT</small><b>Auditoría y Control Interno</b></div>

</header>

<main class="wrap" id="app"><section class="panel"><h1>Cargando…</h1></section></main>
<div id="dockHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
"use strict";
var APP_VERSION="3.0";
/* ===================== almacenamiento local (IndexedDB) ===================== */
var DB={db:null,
  open:function(){var self=this;return new Promise(function(res,rej){var r=indexedDB.open("auditorias-hvut",1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore("kv");d.createObjectStore("aud",{keyPath:"id"});d.createObjectStore("blob");d.createObjectStore("notas",{keyPath:"id"});};
    r.onsuccess=function(){self.db=r.result;res();};r.onerror=function(){rej(r.error);};});},
  tx:function(st,mode,fn){var self=this;return new Promise(function(res,rej){var t=self.db.transaction(st,mode),s=t.objectStore(st),out,q=fn(s);
    if(q)q.onsuccess=function(){out=q.result;};t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error);};});},
  get:function(st,k){return this.tx(st,"readonly",function(s){return s.get(k);});},
  put:function(st,v,k){return this.tx(st,"readwrite",function(s){return k===undefined?s.put(v):s.put(v,k);});},
  del:function(st,k){return this.tx(st,"readwrite",function(s){return s.delete(k);});},
  all:function(st){return this.tx(st,"readonly",function(s){return s.getAll();});}
};

/* ===================== estado y utilidades ===================== */
var S={datos:null,planesPend:{},fil:{},regSel:null,cfg:null,conf:null,auds:[],notas:[],view:"inicio",aud:null,area:0,syncing:false,prog:"",confirm:null,sigDirty:false,thumbURLs:{},lastSync:null};
function $(s){return document.querySelector(s);}
var app=$("#app");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function pad2(n){return String(n).padStart(2,"0");}
function hoyISO(d){d=d||new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function hora(d){d=d||new Date();return pad2(d.getHours())+":"+pad2(d.getMinutes());}
function fechaCO(iso){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?m[3]+"/"+m[2]+"/"+m[1]:(iso||"");}
function fechaHora(iso){if(!iso)return"";var d=new Date(iso);return fechaCO(hoyISO(d))+" "+hora(d);}
function uid(){var a=new Uint8Array(8);crypto.getRandomValues(a);return Date.now().toString(36)+"-"+Array.prototype.map.call(a,function(b){return b.toString(16).padStart(2,"0");}).join("").slice(0,10);}
function k(c,i){return "c"+c+"_i"+i;}
function lista(v){return String(v||"").split(",").map(function(s){return s.trim();}).filter(Boolean);}
var toastT=null;
function toast(msg,ms){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},ms||2800);}
function online(){return navigator.onLine!==false;}
function netBadge(){$("#net").textContent=online()?"Con conexión":"Sin conexión";}
window.addEventListener("online",function(){netBadge();if(S.view==="inicio")render();});
window.addEventListener("offline",function(){netBadge();if(S.view==="inicio")render();});
function sha256(data){var buf=typeof data==="string"?new TextEncoder().encode(data):data;
  return crypto.subtle.digest("SHA-256",buf).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(b){return b.toString(16).padStart(2,"0");}).join("");});}
function blobHash(b){return b.arrayBuffer().then(sha256);}
function huellaCorta(h){return (h||"").slice(0,16).toUpperCase().replace(/(.{4})(?=.)/g,"$1 ");}
function ordenado(o){if(Array.isArray(o))return o.map(ordenado);if(o&&typeof o==="object"){var r={};Object.keys(o).sort().forEach(function(x){r[x]=ordenado(o[x]);});return r;}return o;}
function b64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1]);};fr.onerror=rej;fr.readAsDataURL(blob);});}

/* ===================== cálculo (idéntico al del servidor) ===================== */
function opciones(f){var partes=lista(f.opciones),conValor=partes.some(function(p){return p.indexOf("=")>0;});
  return partes.map(function(p,i){var m=p.split("="),v;
    if(m.length>1){v=parseFloat(String(m[1]).replace(",","."));if(isNaN(v))v=null;}else v=conValor?null:(i===0?1:i===1?0:null);
    return {t:m[0].trim(),v:v};});}
function claseValor(v){return v===null?"vna":v>=1?"vsi":v<=0?"vno":"vpar";}
function isFixed(f,i,c){var it=f.items[i];return !!(it&&it.fijoNA&&it.fijoNA.indexOf(f.columnas[c])>=0);}
function resumen(a){var f=a.formato,ops=opciones(f),resp=a.resp||{},cols=[];
  f.columnas.forEach(function(col,c){var r={col:col,si:0,parcial:0,no:0,na:0,pend:0,fij:0,wv:0,wAns:0,wApl:0,pts:0};
    f.items.forEach(function(it,i){if(isFixed(f,i,c)){r.fij++;return;}
      var w=numero(it.peso,1),wNA=numero(it.pesoNA,0);var t=resp[k(c,i)];
      if(!t){r.pend++;r.wApl+=w;return;}
      var o=null;ops.forEach(function(x){if(x.t===t)o=x;});
      if(!o||o.v===null){r.na++;r.pts+=wNA;return;}
      r.wApl+=w;r.wAns+=w;r.wv+=w*o.v;r.pts+=w*o.v;if(o.v>=1)r.si++;else if(o.v<=0)r.no++;else r.parcial++;});
    if(f.calculo==="puntos")r.pct=r.pts/100;
    else if(f.calculo==="pesos")r.pct=r.na===0?r.wv/100:(r.wApl?r.wv/r.wApl:null);
    else if(f.calculo==="aplicables")r.pct=r.wApl?r.wv/r.wApl:null;
    else r.pct=r.wAns?r.wv/r.wAns:null;
    cols.push(r);});
  var usar=(f.totalAreas&&f.totalAreas.length)?cols.filter(function(r){return f.totalAreas.indexOf(r.col)>=0;}):cols;
  var vals=usar.filter(function(r){return r.pct!==null;}).map(function(r){return r.pct;});
  var T={si:0,parcial:0,no:0,na:0,pend:0};cols.forEach(function(r){T.si+=r.si;T.parcial+=r.parcial;T.no+=r.no;T.na+=r.na+r.fij;T.pend+=r.pend;});
  T.pct=vals.length?vals.reduce(function(s,x){return s+x;},0)/vals.length:null;
  return {cols:cols,total:T,ops:ops};}
function numero(v,d){return (v===""||v==null||isNaN(Number(v)))?d:Number(v);}
function conPuntos(f){return f.calculo==="pesos"||f.calculo==="puntos";}
function fmtPeso(p){return String(Math.round(Number(p)*1000)/1000).replace(".",",")+" %";}
function fmtPct(p){return p==null?"—":(Math.round(p*1000)/10).toString().replace(".",",")+" %";}
function metodo(f){var m=f.calculo==="puntos"?"Puntos fijos por ítem: cumple y no aplica suman sus puntos; no cumple y sin responder suman 0":f.calculo==="pesos"?"Suma de pesos de cada ítem (cumple = 1, parcial = 0,5, no cumple = 0)":f.calculo==="aplicables"?"Cumple sobre el total de ítems aplicables de cada área":"Cumple / (Cumple + No cumple); los “no aplica” no cuentan";
  if(f.columnas.length>1)m+=". Total general: promedio de "+((f.totalAreas&&f.totalAreas.length)?f.totalAreas.join(", "):f.columnas.join(", "));return m;}
function umbral(f){var m=/(\d+(?:[.,]\d+)?)\s*(?:-\s*\d+\s*)?%/.exec(f.regla||"");return m?parseFloat(m[1].replace(",","."))/100:null;}
function estadoSync(a){if(a.estado!=="finalizada")return"";var s=a.sync||{};if(s.ok)return"subida";if(s.aud)return"parcial";return"pendiente";}
function etiqueta(f){return f.etiqueta||(f.tipo==="Funcionario"?"Funcionario evaluado":"Responsable del servicio");}

/* ===================== arranque ===================== */
function boot(){
  netBadge();

function comprimir(file,M,q){return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cv.toBlob(function(b){b?res(b):rej(new Error("blob"));},"image/jpeg",q);};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}

function initSig(){var cv=$("#sig");if(!cv)return;var dpr=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
  cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);var g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#fff";g.fillRect(0,0,rect.width,rect.height);g.lineWidth=2.2;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#111";
  var down=false;S.sigDirty=false;function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  cv.onpointerdown=function(e){down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}var p=pos(e);g.beginPath();g.moveTo(p[0],p[1]);};
  cv.onpointermove=function(e){if(!down)return;var p=pos(e);g.lineTo(p[0],p[1]);g.stroke();S.sigDirty=true;};
  cv.onpointerup=cv.onpointercancel=function(){down=false;};}

var ESTADOS=["Abierto","En seguimiento","Cerrado"];
function navMarcar(){var n=$("#nav");if(!n)return;n.hidden=!S.conf;
  var h=document.querySelector(".bar");if(h)document.documentElement.style.setProperty("--barh",h.offsetHeight+"px");
  var actual=S.view==="auditar"||S.view==="ver"?(S.volverA&&S.view==="ver"?S.volverA:"inicio"):S.view;
  Array.prototype.forEach.call(n.querySelectorAll("[data-nav]"),function(b){if(b.dataset.nav===actual)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});}
function metaGeneral(){var m=S.conf&&S.conf.meta;return (m>0)?m:0.8;}
function formatoDe(r){if(!S.conf)return null;return S.conf.formatos.find(function(f){return f.id===r.formatoId;})||S.conf.formatos.find(function(f){return f.nombre===r.formato;})||null;}
function metaDe(r){var f=formatoDe(r),u=f?umbral(f):null;return u!==null?u:metaGeneral();}
function bajoMeta(r){return r.pct!==null&&r.pct!==undefined&&r.pct!==""&&Number(r.pct)<metaDe(r);}
function descargarDatos(){return fetch(S.cfg.url+(S.cfg.url.indexOf("?")>=0?"&":"?")+"action=datos&clave="+encodeURIComponent(S.cfg.clave),{method:"GET",redirect:"follow"})
  .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||"Respuesta inválida");S.datos=j;return DB.put("kv",j,"datos");});}
function subirPlanes(){var ids=Object.keys(S.planesPend||{}),chain=Promise.resolve();
  ids.forEach(function(id){chain=chain.then(function(){return post({action:"plan",plan:S.planesPend[id]}).then(function(){var p=S.planesPend[id];delete S.planesPend[id];
    if(S.datos){S.datos.planes=(S.datos.planes||[]).filter(function(x){return x.id!==id;});S.datos.planes.push(p);}return DB.put("kv",S.planesPend,"planesPend");});});});
  return chain;}
function extraTxt(m){return Object.keys(m.extra||{}).filter(function(x){return m.extra[x];}).map(function(x){var v=m.extra[x];return x+": "+(/^\d{4}-\d{2}-\d{2}$/.test(v)?fechaCO(v):v);}).join(" · ");}
function hallLocales(a){var f=a.formato,r=resumen(a),out=[];f.items.forEach(function(it,i){f.columnas.forEach(function(col,c){var v=(a.resp||{})[k(c,i)],o=(a.obs||{})[k(c,i)],op=r.ops.find(function(x){return x.t===v;});
  var res=op&&op.v!==null?(op.v>=1?"Cumple":op.v<=0?"No cumple":"Parcial"):(v?"No aplica":"Sin responder");
  if(res==="No cumple"||res==="Parcial"||o)out.push({id:a.id,area:col,n:it.n,seccion:it.seccion,texto:it.texto,resp:v||"",resultado:res,obs:o||""});});});return out;}
function filasRegistro(){var d=S.datos||{auditorias:[]},map={},out=[];
  (d.auditorias||[]).forEach(function(x){var r={id:x.id,fecha:x.fecha,mes:String(x.fecha).slice(0,7),carpeta:x.carpeta,formato:x.formato,formatoId:x.formatoId,
    evaluado:x.funcionario||x.servicio||"",funcionario:x.funcionario,servicio:x.servicio,evaluador:x.evaluador,pct:x.pct===""?null:x.pct,si:x.si,no:x.no,na:x.na,pend:x.pend,
    pdf:x.pdf,evid:x.evid,obsGeneral:x.obsGeneral,extra:x.extra,areas:x.areas||[],enDrive:true};map[x.id]=r;out.push(r);});
  S.auds.forEach(function(a){if(a.estado!=="finalizada")return;if(map[a.id]){map[a.id].local=true;return;}var rr=resumen(a),m=a.meta;
    out.push({id:a.id,fecha:m.fecha,mes:m.fecha.slice(0,7),carpeta:a.formato.carpeta,formato:a.formato.nombre,formatoId:a.formato.id,evaluado:m.funcionario||m.servicio||"",
      funcionario:m.funcionario,servicio:m.servicio,evaluador:m.evaluador,pct:rr.total.pct,si:rr.total.si,no:rr.total.no,na:rr.total.na,pend:rr.total.pend,obsGeneral:a.obsGeneral,
      extra:extraTxt(m),areas:a.formato.columnas.length>1?rr.cols.map(function(x){return {area:x.col,pct:x.pct};}):[],local:true,enDrive:false});});
  return out.sort(function(a,b){return String(b.fecha).localeCompare(String(a.fecha));});}
function todosHallazgos(){var out=((S.datos&&S.datos.hallazgos)||[]).slice(),en={};((S.datos&&S.datos.auditorias)||[]).forEach(function(x){en[x.id]=1;});
  S.auds.forEach(function(a){if(a.estado==="finalizada"&&!en[a.id])out=out.concat(hallLocales(a));});return out;}
function planDe(id){if(S.planesPend&&S.planesPend[id])return S.planesPend[id];return ((S.datos&&S.datos.planes)||[]).find(function(p){return p.id===id;})||null;}
function unicos(rows,campo){var o={};rows.forEach(function(r){if(r[campo])o[r[campo]]=1;});return Object.keys(o).sort(function(a,b){return a.localeCompare(b,"es");});}
function mesTxt(m){var n=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],p=String(m).split("-");return p.length===2?n[+p[1]-1]+" "+p[0]:m;}
function filtrar(rows,ign){var F=S.fil||{};return rows.filter(function(r){
  if(F.carpeta&&r.carpeta!==F.carpeta)return false;if(F.formato&&r.formato!==F.formato)return false;
  if(ign!=="mes"){if(F.mes&&r.mes!==F.mes)return false;}else{if(F.desde&&r.mes<F.desde)return false;if(F.hasta&&r.mes>F.hasta)return false;}
  if(F.evaluado&&r.evaluado!==F.evaluado)return false;if(F.evaluador&&r.evaluador!==F.evaluador)return false;return true;});}
function selF(campo,etq,vals,fmt){var v=(S.fil||{})[campo]||"";return '<label class="f">'+esc(etq)+'<select data-fil="'+campo+'"><option value="">Todos</option>'+
  vals.map(function(x){return '<option value="'+esc(x)+'"'+(x===v?' selected':'')+'>'+esc(fmt?fmt(x):x)+'</option>';}).join("")+'</select></label>';}
function filtrosHtml(rows,rango){var base=rows,F=S.fil||{};var meses=unicos(base,"mes").reverse();
  var fmts=unicos(F.carpeta?base.filter(function(r){return r.carpeta===F.carpeta;}):base,"formato");
  return '<section class="panel"><div class="filtros">'+selF("carpeta","Servicio",unicos(base,"carpeta"))+selF("formato","Lista de chequeo",fmts)+
    (rango?selF("desde","Desde",meses,mesTxt)+selF("hasta","Hasta",meses,mesTxt):selF("mes","Mes",meses,mesTxt))+
    selF("evaluado","Evaluado / área",unicos(base,"evaluado"))+selF("evaluador","Auditor(a)",unicos(base,"evaluador"))+'</div>'+
    ((F.carpeta||F.formato||F.mes||F.desde||F.hasta||F.evaluado||F.evaluador)?'<div class="row"><button type="button" class="ghost" data-act="limpiarfil">Quitar filtros</button></div>':'')+'</section>';}
function sinDatosHtml(){return S.datos?'':'<div class="empty">Aún no se ha descargado el registro de Drive. Toque <b>Sincronizar</b> en la pestaña Auditar con conexión a internet. Mientras tanto se muestran solo las auditorías de esta tablet.</div>';}
function cabecera(t,sub){return '<section style="display:flex;flex-direction:column;gap:6px"><h2>'+esc(sub)+'</h2><h1>'+esc(t)+'</h1>'+
  (S.datos?'<p class="small muted">Datos de Drive al '+esc(fechaHora(S.datos.generado))+' · se actualizan al sincronizar</p>':'')+'</section>';}

  var lim=rows.slice(0,250);
  app.innerHTML=cabecera("Registro de auditorías","Todas las auditoras · todos los equipos")+sinDatosHtml()+filtrosHtml(todas)+

    (lim.length?'<div class="list">'+lim.map(function(r){var bajo=bajoMeta(r),sel=S.regSel===r.id,hs=porId[r.id]||[];
      var chip=!r.enDrive?'<span class="chip bad">Pendiente de subir</span>':bajo?'<span class="chip bad">Bajo la meta</span>':'';
      var det='';if(sel){var p=planDe(r.id);

          '<p class="small muted">Cumple '+(r.si||0)+' · No cumple '+(r.no||0)+' · No aplica '+(r.na||0)+(r.pend?' · Sin responder '+r.pend:'')+'</p>'+
          (hs.length?'<div class="list">'+hs.map(function(h){return '<div class="li"><div class="main"><b>'+esc(h.n)+'. '+esc(h.texto)+'</b><span class="small muted">'+(h.area&&h.area!=="General"?esc(h.area)+' · ':'')+esc(h.resultado)+(h.obs?' · '+esc(h.obs):'')+'</span></div></div>';}).join("")+'</div>':'<p class="small muted">Sin no conformidades.</p>')+
          (r.obsGeneral?'<p class="small"><b>Observaciones generales:</b> '+esc(r.obsGeneral)+'</p>':'')+
          (bajo?'<p class="small"><b>Plan de mejora:</b> '+(p?esc(p.estado||"Abierto")+(p.factor?' · '+esc(p.factor):''):'sin registrar')+'</p>':'')+
          '<div class="row">'+(r.local?'<button type="button" class="pri" data-act="ver" data-id="'+esc(r.id)+'">Ver auditoría completa</button>':'')+
          (r.pdf?'<a class="btn" href="'+esc(r.pdf)+'" target="_blank" rel="noopener">Abrir PDF con fotos y firmas</a>':'')+
          (r.evid?'<a class="btn" href="'+esc(r.evid)+'" target="_blank" rel="noopener">Fotos en Drive</a>':'')+
          (bajo?'<button type="button" data-act="irplan" data-id="'+esc(r.id)+'">Plan de mejora</button>':'')+'</div></div>';}
      return '<div class="li"><div class="main"><h3>'+esc(r.formato)+'</h3><div class="row small muted"><span>'+esc(fechaCO(r.fecha))+'</span><span>'+esc(r.evaluado||"—")+'</span><span>Auditor: '+esc(r.evaluador||"—")+'</span>'+chip+'</div></div>'+

    var hall=todosHallazgos(),porId={};hall.forEach(function(h){if(h.resultado==="No cumple"||h.resultado==="Parcial")(porId[h.id]=porId[h.id]||[]).push(h);});
    function obsDe(r){if(r.obsGeneral)return r.obsGeneral;return (porId[r.id]||[]).map(function(h){return h.n+". "+h.texto+(h.obs?": "+h.obs:"");}).join("; ");}
    var orden=rows.slice().sort(function(a,b){return String(a.fecha).localeCompare(String(b.fecha));});
    var datos=orden.map(function(r){return {semana:semanaDe(r.fecha),fecha:fechaD(r.fecha),pac:pacienteDe(r),aud:r.formato,tipo:tipoDe(r.formato),
      evaluado:r.evaluado||"",pct:(r.pct===null||r.pct===undefined||r.pct==="")?null:Number(r.pct),obs:obsDe(r),auditor:r.evaluador||""};});
    function encab(ws,fila,cols){var rw=ws.getRow(fila);cols.forEach(function(c,j){var cell=rw.getCell(j+1);cell.value=c;cell.font={name:"Arial",size:10,bold:true,color:{argb:"FFFFFFFF"}};

    function celdas(ws,fila,vals,pctCol){var rw=ws.getRow(fila);vals.forEach(function(v,j){var cell=rw.getCell(j+1);cell.value=v===""?null:v;cell.font={name:"Arial",size:10};cell.border=BORDE;
      cell.alignment={vertical:"top",wrapText:true};if(v instanceof Date){cell.numFmt="dd/mm/yyyy";cell.alignment.horizontal="center";}
      if(j===pctCol){cell.numFmt="0.00%";cell.alignment.horizontal="center";}});}
    function colores(ws,ref){ws.addConditionalFormatting({ref:ref,rules:[
      {type:"cellIs",operator:"greaterThan",priority:1,formulae:["0.99999"],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FF00FF00"}}}},
      {type:"cellIs",operator:"between",priority:2,formulae:["0.8","0.99999"],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFFF9900"}}}},
      {type:"cellIs",operator:"lessThan",priority:3,formulae:["0.8"],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFFF0000"}}}}]});}
    /* Bitácora */
    var wb1=wb.addWorksheet("Resumen",{views:[{state:"frozen",ySplit:1}]});
    wb1.columns=[5,11.5,16,30,18,24,13,40,16,24].map(function(w){return {width:w};});
    encab(wb1,1,["N°","Fecha","Paciente HC","Auditoría","Tipo de auditoría","Auditado","% cumplimiento","Observaciones","Auditor","Semana"]);
    datos.forEach(function(d,i){celdas(wb1,2+i,[i+1,d.fecha,d.pac,d.aud,d.tipo,d.evaluado,d.pct,d.obs,d.auditor,d.semana],6);});
    var fin=1+datos.length;wb1.autoFilter={from:{row:1,column:1},to:{row:fin,column:10}};colores(wb1,"G2:G"+fin);
    /* Una pestaña por médico (o persona evaluada) */
    var gente=((S.conf&&S.conf.personal)||[]).filter(function(p){return p.auditado;}).map(function(p){return p.nombre;}),usadas={};
    gente.forEach(function(nombre){var k=sinT(nombre),suyas=datos.filter(function(d){return sinT(d.evaluado).indexOf(k)>=0;});if(!suyas.length)return;
      var pri=k.split(" ")[0],trato=TRATO[pri]?TRATO[pri]+" ":"";
      var tab=(trato+nombre).replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31),n=2;while(usadas[tab])tab=tab.slice(0,29)+" "+(n++);usadas[tab]=1;
      var ws=wb.addWorksheet(tab,{views:[{state:"frozen",ySplit:2}]});ws.columns=[24,11.5,16,30,18,24,13,40,16].map(function(w){return {width:w};});
      ws.getCell(1,1).value="Reporte de auditorías – "+trato+nombre;ws.getCell(1,1).font={name:"Arial",size:12,bold:true};ws.getRow(1).height=20;
      encab(ws,2,["Semana","Fecha","Paciente HC","Auditoría","Tipo de auditoría","Auditado","% cumplimiento","Observaciones","Auditor"]);
      suyas.forEach(function(d,i){celdas(ws,3+i,[d.semana,d.fecha,d.pac,d.aud,d.tipo,d.evaluado,d.pct,d.obs,d.auditor],6);});
      var f=2+suyas.length,p=ws.getRow(f+2);p.getCell(6).value="Promedio";p.getCell(6).font={name:"Arial",size:10,bold:true};
      var vs=suyas.filter(function(d){return d.pct!==null;}),pr=vs.length?vs.reduce(function(s,d){return s+d.pct;},0)/vs.length:null;
      p.getCell(7).value={formula:"AVERAGE(G3:G"+f+")",result:pr};p.getCell(7).numFmt="0.00%";p.getCell(7).font={name:"Arial",size:10,bold:true};p.getCell(7).alignment={horizontal:"center"};
      colores(ws,"G3:G"+f);ws.autoFilter={from:{row:2,column:1},to:{row:f,column:9}};});

    var nom=("Resumen de Auditorias - "+textoFiltro()+" - "+hoyISO()).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g," ").replace(/\s+/g," ").trim().slice(0,110)+".xlsx";
    l.href=url;l.download=nom;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(url);},8000);toast("Excel descargado: "+nom,5000);})

/* ===================== acciones de las vistas nuevas ===================== */
function borrarLocal(){var host=$("#confirmLocal");if(S.confirm!=="borrarlocal"){S.confirm="borrarlocal";var pend=S.auds.filter(function(a){return a.estado==="finalizada"&&estadoSync(a)!=="subida";}).length;
    host.innerHTML='<div class="confirm"><b>¿Borrar las '+S.auds.length+' auditorías guardadas en esta tablet?</b>'+(pend?'<p>'+pend+' aún no se han subido a Drive y se perderán.</p>':'<p>Todas las finalizadas ya están en Drive.</p>')+
      '<div class="row"><button type="button" class="danger" data-act="borrarlocal">Sí, borrar</button><button type="button" data-act="cancelconfirm2">Cancelar</button></div></div>';return;}
  S.confirm=null;var chain=Promise.resolve();S.auds.forEach(function(a){var ids=(a.fotos||[]).map(function(p){return p.id;}).concat(["pdf_"+a.id]).concat(a.firma?[a.firma.id]:[]);
    chain=chain.then(function(){return Promise.all(ids.map(function(id){return DB.del("blob",id);}));}).then(function(){return DB.del("aud",a.id);});});
  S.notas.forEach(function(n){chain=chain.then(function(){return DB.del("notas",n.id);});});
  chain.then(function(){S.auds=[];S.notas=[];toast("Auditorías de la tablet borradas.");go("ajustes");});}
function accionVistas(act,b){
  if(act==="regsel"){S.regSel=S.regSel===b.dataset.id?null:b.dataset.id;vRegistro();var el=b.closest(".li");return true;}
  if(act==="limpiarfil"){S.fil={};S.regSel=null;render();return true;}
  if(act==="irplan"){S.fil={};go("planes");var el2=document.getElementById("plan_"+b.dataset.id);if(el2)el2.scrollIntoView({block:"start"});return true;}
  if(act==="guardarplan"){guardarPlan(b.dataset.id);return true;}
  if(act==="excel"){exportarExcel();return true;}
  if(act==="excelres"){exportarResumen();return true;}
  if(act==="borrarlocal"){borrarLocal();return true;}
  if(act==="cancelconfirm2"){S.confirm=null;var h=$("#confirmLocal");if(h)h.innerHTML="";return true;}
  return false;}

/* ===================== eventos ===================== */
document.addEventListener("click",function(e){var nv=e.target.closest("[data-nav]");if(nv){if(S.view==="auditar"&&S.aud&&S.aud.estado!=="finalizada")guardarAud(S.aud);return go(nv.dataset.nav);}
  var b=e.target.closest("[data-act]");if(!b)return;var act=b.dataset.act;
  if(accionVistas(act,b))return;
  if(act==="conectar")return conectar();if(act==="liberar")return liberarEspacio();if(act==="sync")return sincronizar();
  if(act==="grupo"){var g=b.dataset.g;S.carpetaAbierta=(S.carpetaAbierta===g)?null:g;return vInicio();}
  if(act==="nueva")return nuevaAuditoria(b.dataset.id);if(act==="continuar"||act==="ver")return abrir(b.dataset.id);
  if(S.view==="ver"){if(act==="pdf")return descargarPDF();if(act==="nota")return agregarNota();if(act==="volver")return go(S.volverA||"inicio");return;}
  if(!S.aud||S.aud.estado==="finalizada")return;
  if(act==="area"){S.area=+b.dataset.c;renderTabs();renderItems();var t=$("#tabs");if(t)window.scrollTo({top:t.offsetTop-70});return;}
  if(act==="resp"){var i=+b.dataset.i,key=k(S.area,i);var ta=document.getElementById("obs_"+key);if(ta)S.aud.obs[key]=ta.value;
    S.aud.resp[key]=(S.aud.resp[key]===b.dataset.v)?"":b.dataset.v;if(!S.aud.resp[key])delete S.aud.resp[key];refrescarItem(i);renderTabs();dock();guardarBorrador();
    var op=opciones(S.aud.formato).find(function(x){return x.t===S.aud.resp[key];});if(op&&op.v!==null&&op.v<1){var t2=document.getElementById("obs_"+key);if(t2&&!t2.value)t2.focus({preventScroll:true});}return;}
  if(act==="obs"){var i2=+b.dataset.i;S.aud.obsAbierta=k(S.area,i2);refrescarItem(i2);var t3=document.getElementById("obs_"+k(S.area,i2));if(t3)t3.focus();return;}
  if(act==="foto")return pedirFoto(+b.dataset.c,+b.dataset.i);
  if(act==="quitarfoto"){var p=S.aud.fotos[+b.dataset.ix];S.aud.fotos.splice(+b.dataset.ix,1);DB.del("blob",p.id);guardarAud(S.aud).then(function(){renderThumbs(p.c,p.i);});toast("Foto quitada");return;}
  if(act==="limpiarfirma")return initSig();if(act==="finalizar")return finalizar();
  if(act==="cancelconfirm"){S.confirm=null;$("#confirmHost").innerHTML="";return;}
  if(act==="descartar"){if(S.confirm!=="del"){S.confirm="del";$("#confirmHost").innerHTML='<div class="confirm"><b>¿Eliminar este borrador?</b><p>Se borran sus respuestas y fotos. Solo los borradores se pueden eliminar.</p><div class="row"><button type="button" class="danger" data-act="descartar">Sí, eliminar</button><button type="button" data-act="cancelconfirm">Cancelar</button></div></div>';$("#confirmHost").scrollIntoView({block:"center"});return;}
    var a=S.aud;Promise.all((a.fotos||[]).map(function(x){return DB.del("blob",x.id);})).then(function(){return DB.del("aud",a.id);}).then(function(){S.auds=S.auds.filter(function(x){return x.id!==a.id;});S.aud=null;toast("Borrador eliminado");go("inicio");});return;}});
document.addEventListener("input",function(e){var t=e.target;if(S.view!=="auditar"||!S.aud||S.aud.estado==="finalizada")return;
  if(t.dataset.meta){S.aud.meta[t.dataset.meta]=t.value;if(t.dataset.meta==="funcionario"){var fi=$("#firmante");if(fi&&!S.aud.firmante)fi.value=t.value;}guardarBorrador();}
  else if(t.dataset.extra){S.aud.meta.extra=S.aud.meta.extra||{};S.aud.meta.extra[t.dataset.extra]=t.value;guardarBorrador();}
  else if(t.dataset.obs){S.aud.obs[t.dataset.obs]=t.value;guardarBorrador();}
  else if(t.dataset.colitem){S.aud.colItem=S.aud.colItem||{};S.aud.colItem[t.dataset.colitem]=t.value;guardarBorrador();}
  else if(t.dataset.gen){S.aud.obsGeneral=t.value;guardarBorrador();}
  else if(t.id==="firmante"){S.aud.firmante=t.value;guardarBorrador();}});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset.fil!==undefined){S.fil[t.dataset.fil]=t.value;S.regSel=null;return render();}
  if(S.view!=="auditar"||!S.aud)return;
  if(t.dataset.meta){S.aud.meta[t.dataset.meta]=t.value;guardarBorrador();}
  else if(t.dataset.colitem){S.aud.colItem=S.aud.colItem||{};S.aud.colItem[t.dataset.colitem]=t.value;guardarBorrador();}
  else if(t.dataset.extra){S.aud.meta.extra=S.aud.meta.extra||{};S.aud.meta.extra[t.dataset.extra]=t.value;guardarBorrador();}});
boot();
})();
