<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auditorías HVUT</title>
<meta name="theme-color" content="#006400">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Herramienta de campo para tablet: barra institucional fija, una columna de trabajo, controles grandes para el dedo */
:root{
  --bg:#f4f7f3; --surface:#ffffff; --sunken:#eef3ed; --fg:#16241a; --muted:#56685a; --line:#d5e0d6;
  --accent:#006400; --accent-ink:#ffffff; --accent-soft:#e1efe1; --bar:#006400; --bar-ink:#ffffff;
  --ok:#1b7a34; --ok-soft:#e2f3e5; --bad:#b3261e; --bad-soft:#fbe8e6; --na:#5f6872; --na-soft:#eceff1; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif; --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1410; --surface:#162019; --sunken:#111a13; --fg:#e4eee5; --muted:#99ab9c; --line:#2a382d;
  --accent:#62c06c; --accent-ink:#08130a; --accent-soft:#1b2f1e; --bar:#0b3d10; --bar-ink:#eaf5ea;
  --ok:#72d081; --ok-soft:#173221; --bad:#ff8b80; --bad-soft:#3a1e1b; --na:#a3adb6; --na-soft:#232b26; --warn:#f0c060; --warn-soft:#3a2f14; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:9;background:var(--bar);color:var(--bar-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .inst{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.bar .inst small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.bar .inst b{font-size:16px}
.bar .sp{flex:1}
.bar button{background:transparent;color:var(--bar-ink);border:1px solid rgba(255,255,255,.5)}
.net{font-size:12px;font-weight:bold;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
.wrap{padding:18px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font-size:16px;margin:0;text-wrap:balance}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)} .small{font-size:13px}
button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:bold}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
input[readonly]{background:var(--sunken);color:var(--muted)}
textarea{min-height:70px;resize:vertical;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
label.f b{color:var(--bad);font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);line-height:1.5}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.pct{font-variant-numeric:tabular-nums;font-weight:bold;font-size:18px;min-width:64px;text-align:right}
.sync{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sync .st{flex:1;min-width:220px;display:flex;flex-direction:column;gap:3px}
.sync .st b{font-size:17px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;min-width:120px;flex-direction:column;align-items:flex-start;padding:8px 14px;gap:2px}
.tab small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:34px 1fr;gap:4px 10px}
.item.st-vno{border-left:4px solid var(--bad)} .item.st-vsi{border-left:4px solid var(--ok)} .item.st-vna,.item.st-na{border-left:4px solid var(--na)} .item.st-vpar{border-left:4px solid var(--warn)}
.item .n{font-weight:bold;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item .t{line-height:1.45;min-width:0}
.item .ctl{grid-column:2;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:72px;font-weight:bold}
.seg button[aria-pressed="true"].vsi{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"].vno{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seg button[aria-pressed="true"].vpar{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"].vna{background:var(--na);border-color:var(--na);color:var(--surface)}
.grp{width:100%;justify-content:flex-start;min-height:56px;border:0;border-radius:var(--r);padding:0 16px;font-size:16px}
.grp .sp{flex:1}
details.info summary{cursor:pointer;font-weight:bold;color:var(--accent);min-height:28px}
details.info p{margin-top:6px}
.peso{display:inline-block;margin-left:8px;font-size:12px;font-weight:bold;color:var(--muted);background:var(--sunken);padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.colitem{max-width:360px}
.seg .aux{font-weight:normal;color:var(--muted);min-width:0}
.fixed{font-size:13px;color:var(--na);background:var(--na-soft);padding:8px 10px;border-radius:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunken)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;min-height:28px;height:28px;padding:0 8px;font-size:12px;background:rgba(0,0,0,.6);color:#fff;border:0}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:bold;margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock .stat{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.dock .stat b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.sig{width:100%;height:180px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.confirm{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.lock{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.huella{font-family:"Courier New",monospace;font-weight:bold;letter-spacing:.06em}
table.sum{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:8px;text-align:center}
table.sum th:first-child,table.sum td:first-child{text-align:left}
.tw{overflow-x:auto}
.nota{border-left:3px solid var(--warn);padding:6px 10px;background:var(--warn-soft);border-radius:0 8px 8px 0}
.prog{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<header class="bar">
  <div class="inst"><small>Universidad del Tolima · HVUT</small><b>Auditorías internas</b></div>
  <span class="sp"></span>
  <span class="net" id="net">…</span>
  <button id="btnHome" type="button" hidden>Inicio</button>
  <button id="btnAjustes" type="button">Ajustes</button>
</header>
<main class="wrap" id="app"><section class="panel"><h1>Cargando…</h1></section></main>
<div id="dockHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
"use strict";
var APP_VERSION="2.0";
/* ===================== almacenamiento local (IndexedDB) ===================== */
var DB={db:null,
  open:function(){var self=this;return new Promise(function(res,rej){var r=indexedDB.open("auditorias-hvut",1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore("kv");d.createObjectStore("aud",{keyPath:"id"});d.createObjectStore("blob");d.createObjectStore("notas",{keyPath:"id"});};
    r.onsuccess=function(){self.db=r.result;res();};r.onerror=function(){rej(r.error);};});},
  tx:function(st,mode,fn){var self=this;return new Promise(function(res,rej){var t=self.db.transaction(st,mode),s=t.objectStore(st),out,q=fn(s);
    if(q)q.onsuccess=function(){out=q.result;};t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error);};});},
  get:function(st,k){return this.tx(st,"readonly",function(s){return s.get(k);});},
  put:function(st,v,k){return this.tx(st,"readwrite",function(s){return k===undefined?s.put(v):s.put(v,k);});},
  del:function(st,k){return this.tx(st,"readwrite",function(s){return s.delete(k);});},
  all:function(st){return this.tx(st,"readonly",function(s){return s.getAll();});}
};

/* ===================== estado y utilidades ===================== */
var S={cfg:null,conf:null,auds:[],notas:[],view:"inicio",aud:null,area:0,syncing:false,prog:"",confirm:null,sigDirty:false,thumbURLs:{},lastSync:null};
function $(s){return document.querySelector(s);}
var app=$("#app");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function pad2(n){return String(n).padStart(2,"0");}
function hoyISO(d){d=d||new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function hora(d){d=d||new Date();return pad2(d.getHours())+":"+pad2(d.getMinutes());}
function fechaCO(iso){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?m[3]+"/"+m[2]+"/"+m[1]:(iso||"");}
function fechaHora(iso){if(!iso)return"";var d=new Date(iso);return fechaCO(hoyISO(d))+" "+hora(d);}
function uid(){var a=new Uint8Array(8);crypto.getRandomValues(a);return Date.now().toString(36)+"-"+Array.prototype.map.call(a,function(b){return b.toString(16).padStart(2,"0");}).join("").slice(0,10);}
function k(c,i){return "c"+c+"_i"+i;}
function lista(v){return String(v||"").split(",").map(function(s){return s.trim();}).filter(Boolean);}
var toastT=null;
function toast(msg,ms){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},ms||2800);}
function online(){return navigator.onLine!==false;}
function netBadge(){$("#net").textContent=online()?"Con conexión":"Sin conexión";}
window.addEventListener("online",function(){netBadge();if(S.view==="inicio")render();});
window.addEventListener("offline",function(){netBadge();if(S.view==="inicio")render();});
function sha256(data){var buf=typeof data==="string"?new TextEncoder().encode(data):data;
  return crypto.subtle.digest("SHA-256",buf).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(b){return b.toString(16).padStart(2,"0");}).join("");});}
function blobHash(b){return b.arrayBuffer().then(sha256);}
function huellaCorta(h){return (h||"").slice(0,16).toUpperCase().replace(/(.{4})(?=.)/g,"$1 ");}
function ordenado(o){if(Array.isArray(o))return o.map(ordenado);if(o&&typeof o==="object"){var r={};Object.keys(o).sort().forEach(function(x){r[x]=ordenado(o[x]);});return r;}return o;}
function b64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1]);};fr.onerror=rej;fr.readAsDataURL(blob);});}

/* ===================== cálculo (idéntico al del servidor) ===================== */
function opciones(f){var partes=lista(f.opciones),conValor=partes.some(function(p){return p.indexOf("=")>0;});
  return partes.map(function(p,i){var m=p.split("="),v;
    if(m.length>1){v=parseFloat(String(m[1]).replace(",","."));if(isNaN(v))v=null;}else v=conValor?null:(i===0?1:i===1?0:null);
    return {t:m[0].trim(),v:v};});}
function claseValor(v){return v===null?"vna":v>=1?"vsi":v<=0?"vno":"vpar";}
function isFixed(f,i,c){var it=f.items[i];return !!(it&&it.fijoNA&&it.fijoNA.indexOf(f.columnas[c])>=0);}
function resumen(a){var f=a.formato,ops=opciones(f),resp=a.resp||{},cols=[];
  f.columnas.forEach(function(col,c){var r={col:col,si:0,parcial:0,no:0,na:0,pend:0,fij:0,wv:0,wAns:0,wApl:0};
    f.items.forEach(function(it,i){if(isFixed(f,i,c)){r.fij++;return;}
      var w=(it.peso===""||it.peso==null||isNaN(Number(it.peso)))?1:Number(it.peso);var t=resp[k(c,i)];
      if(!t){r.pend++;r.wApl+=w;return;}
      var o=null;ops.forEach(function(x){if(x.t===t)o=x;});
      if(!o||o.v===null){r.na++;return;}
      r.wApl+=w;r.wAns+=w;r.wv+=w*o.v;if(o.v>=1)r.si++;else if(o.v<=0)r.no++;else r.parcial++;});
    if(f.calculo==="pesos")r.pct=r.na===0?r.wv/100:(r.wApl?r.wv/r.wApl:null);
    else if(f.calculo==="aplicables")r.pct=r.wApl?r.wv/r.wApl:null;
    else r.pct=r.wAns?r.wv/r.wAns:null;
    cols.push(r);});
  var usar=(f.totalAreas&&f.totalAreas.length)?cols.filter(function(r){return f.totalAreas.indexOf(r.col)>=0;}):cols;
  var vals=usar.filter(function(r){return r.pct!==null;}).map(function(r){return r.pct;});
  var T={si:0,parcial:0,no:0,na:0,pend:0};cols.forEach(function(r){T.si+=r.si;T.parcial+=r.parcial;T.no+=r.no;T.na+=r.na+r.fij;T.pend+=r.pend;});
  T.pct=vals.length?vals.reduce(function(s,x){return s+x;},0)/vals.length:null;
  return {cols:cols,total:T,ops:ops};}
function fmtPeso(p){return String(Math.round(Number(p)*1000)/1000).replace(".",",")+" %";}
function fmtPct(p){return p==null?"—":(Math.round(p*1000)/10).toString().replace(".",",")+" %";}
function metodo(f){var m=f.calculo==="pesos"?"Suma de pesos de cada ítem (cumple = 1, parcial = 0,5, no cumple = 0)":f.calculo==="aplicables"?"Cumple sobre el total de ítems aplicables de cada área":"Cumple / (Cumple + No cumple); los “no aplica” no cuentan";
  if(f.columnas.length>1)m+=". Total general: promedio de "+((f.totalAreas&&f.totalAreas.length)?f.totalAreas.join(", "):f.columnas.join(", "));return m;}
function umbral(f){var m=/(\d+(?:[.,]\d+)?)\s*(?:-\s*\d+\s*)?%/.exec(f.regla||"");return m?parseFloat(m[1].replace(",","."))/100:null;}
function estadoSync(a){if(a.estado!=="finalizada")return"";var s=a.sync||{};if(s.ok)return"subida";if(s.aud)return"parcial";return"pendiente";}
function etiqueta(f){return f.etiqueta||(f.tipo==="Funcionario"?"Funcionario evaluado":"Responsable del servicio");}

/* ===================== arranque ===================== */
function boot(){
  netBadge();
  if(!("indexedDB" in window)){app.innerHTML='<section class="panel"><h1>Este navegador no es compatible</h1><p>Abra la app en Google Chrome.</p></section>';return;}
  DB.open().then(function(){if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
    return Promise.all([DB.get("kv","cfg"),DB.get("kv","conf"),DB.all("aud"),DB.all("notas"),DB.get("kv","lastSync")]);})
  .then(function(r){S.cfg=r[0]||null;S.conf=r[1]||null;S.auds=r[2]||[];S.notas=r[3]||[];S.lastSync=r[4]||null;go(S.cfg&&S.conf?"inicio":"ajustes");})
  .catch(function(e){app.innerHTML='<section class="panel"><h1>No se pudo abrir el almacenamiento de la tablet</h1><p>'+esc(e&&e.message)+'</p></section>';});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
}
function go(v){S.view=v;S.confirm=null;$("#btnHome").hidden=(v==="inicio"||(v==="ajustes"&&!S.conf));render();window.scrollTo(0,0);}
$("#btnHome").addEventListener("click",function(){go("inicio");});
$("#btnAjustes").addEventListener("click",function(){go("ajustes");});
function render(){$("#dockHost").innerHTML="";limpiarThumbs();
  if(S.view==="ajustes")return vAjustes();if(S.view==="inicio")return vInicio();if(S.view==="auditar")return vAuditar();if(S.view==="ver")return vVer();}
function guardarAud(a){var i=S.auds.findIndex(function(x){return x.id===a.id;});if(i>=0)S.auds[i]=a;else S.auds.push(a);return DB.put("aud",clone(a));}

/* ===================== ajustes ===================== */
function vAjustes(){
  var c=S.cfg||{url:"",clave:"",dispositivo:"Tablet 1"};var subidas=S.auds.filter(function(a){return estadoSync(a)==="subida";});
  app.innerHTML='<section style="display:flex;flex-direction:column;gap:6px"><h2>Ajustes</h2><h1>Conexión con Google Drive</h1>'+
    '<p class="muted">Pegue la URL de la app web y la clave que aparecen en la pestaña "Configuración" de la hoja Indicadores HVUT. Se hace una sola vez por tablet.</p></section>'+
    '<section class="panel"><label class="f">URL de la app web (empieza por https://script.google.com/…)<input id="cfgUrl" value="'+esc(c.url)+'" autocomplete="off"></label>'+
    '<div class="grid"><label class="f">Clave<input id="cfgClave" value="'+esc(c.clave)+'" autocomplete="off"></label><label class="f">Nombre de este dispositivo<input id="cfgDisp" value="'+esc(c.dispositivo)+'"></label></div>'+
    '<div class="row"><button type="button" class="pri" data-act="conectar">Conectar y descargar formatos</button>'+(S.conf?'<span class="small muted">Formatos y personal actualizados: '+esc(fechaHora(S.conf.actualizado))+'</span>':'')+'</div></section>'+
    (S.conf?'<section class="panel"><h3>Espacio en la tablet</h3><p class="small muted">Las auditorías ya subidas a Drive pueden borrar sus fotos y PDF de la tablet. Los datos y la huella se conservan, y todo sigue en Drive.</p><div class="row"><button type="button" data-act="liberar"'+(subidas.length?'':' disabled')+'>Liberar espacio de auditorías subidas hace más de 30 días</button></div></section>':'')+
    '<p class="small muted">Versión de la app '+APP_VERSION+'</p>';}

function comprimir(file,M,q){return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cv.toBlob(function(b){b?res(b):rej(new Error("blob"));},"image/jpeg",q);};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}

/* firma */
function initSig(){var cv=$("#sig");if(!cv)return;var dpr=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
  cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);var g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#fff";g.fillRect(0,0,rect.width,rect.height);g.lineWidth=2.2;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#111";
  var down=false;S.sigDirty=false;function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  cv.onpointerdown=function(e){down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}var p=pos(e);g.beginPath();g.moveTo(p[0],p[1]);};
  cv.onpointermove=function(e){if(!down)return;var p=pos(e);g.lineTo(p[0],p[1]);g.stroke();S.sigDirty=true;};
  cv.onpointerup=cv.onpointercancel=function(){down=false;};}

      (r.total.pend?'<p>Hay '+r.total.pend+' ítems sin responder: quedarán en blanco'+(f.calculo!=="proporcion"?' y cuentan como no cumplidos en el %':'')+'.</p>':'')+
      (S.sigDirty?'':'<p>No hay firma del auditado.</p>')+'<p>Si después encuentra un error, solo podrá agregar una nota aclaratoria.</p>'+
      '<div class="row"><button type="button" class="pri" data-act="finalizar">Sí, finalizar y bloquear</button><button type="button" data-act="cancelconfirm">Seguir auditando</button></div></div>';
    $("#confirmHost").scrollIntoView({behavior:"smooth",block:"center"});return;}
  S.confirm=null;toast("Finalizando…",8000);var cv=$("#sig");
  var pFirma=(cv&&S.sigDirty)?new Promise(function(res){cv.toBlob(res,"image/png");}).then(function(b){return blobHash(b).then(function(h){var id="firma_"+a.id;return DB.put("blob",b,id).then(function(){a.firma={id:id,h:h};});});}):Promise.resolve();
  pFirma.then(function(){var now=new Date();a.meta.horaFin=hora(now);a.finalizado=now.toISOString();a.estado="finalizada";a.firmante=($("#firmante")||{}).value||a.firmante||"";delete a.obsAbierta;
    Object.keys(a.obs||{}).forEach(function(x){if(!String(a.obs[x]).trim())delete a.obs[x];});Object.keys(a.colItem||{}).forEach(function(x){if(!String(a.colItem[x]).trim())delete a.colItem[x];});
    var canon=ordenado({id:a.id,formato:{id:f.id,nombre:f.nombre,version:f.version,opciones:f.opciones,calculo:f.calculo,items:f.items.map(function(it){return [it.n,it.texto,it.peso];}),columnas:f.columnas},
      meta:a.meta,resp:a.resp,obs:a.obs,colItem:a.colItem,obsGeneral:a.obsGeneral,fotos:(a.fotos||[]).map(function(p){return {c:p.c,i:p.i,t:p.t,h:p.h};}),
      firma:a.firma?a.firma.h:null,firmante:a.firmante,finalizado:a.finalizado,dispositivo:a.dispositivo});
    return sha256(JSON.stringify(canon));})
  .then(function(h){a.huella=h;a.sync={aud:false,files:{}};return construirPDF(a);})
  .then(function(pdf){return DB.put("blob",pdf,"pdf_"+a.id);}).then(function(){return guardarAud(a);})

function post(obj){var body=JSON.stringify(Object.assign({clave:S.cfg.clave},obj));
  return fetch(S.cfg.url,{method:"POST",body:body,redirect:"follow"}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||"Error del servidor");return j;});}
function setProg(t,p){S.prog=t;S.progPct=p;var b=$("#progBar");if(b)b.style.width=p+"%";if(S.view==="inicio"){var el=document.querySelector(".sync .st b");if(el)el.textContent=t;}}

  return (p.i<0?"general":"item"+String(f.items[p.i].n||p.i+1).replace(/[^\w.]+/g,"")+(f.columnas.length>1?"_"+String(f.columnas[p.c]).replace(/[^\wÁÉÍÓÚáéíóúÑñ]+/g,""):""))+"_"+hh+"_"+(ix+1)+".jpg";}
function sincronizar(){if(S.syncing||!S.cfg)return;if(!online()){toast("Sin conexión. Conéctese a wifi para sincronizar.");return;}
  S.syncing=true;if(S.view==="inicio")render();
  var pendientes=S.auds.filter(function(a){return a.estado==="finalizada"&&estadoSync(a)!=="subida";}),notas=S.notas.filter(function(n){return !n.synced;});
  var total=pendientes.reduce(function(s,a){return s+1+(a.fotos||[]).length+(a.firma?1:0);},0)+notas.length,hecho=0,err=null;
  function paso(t){hecho++;setProg(t,total?Math.round(hecho/total*100):100);}
  setProg("Actualizando formatos y personal…",0);
  var chain=descargarConfig(S.cfg.url,S.cfg.clave).then(function(conf){S.conf=conf;return DB.put("kv",conf,"conf");}).catch(function(e){err=e;});
  pendientes.forEach(function(a0){chain=chain.then(function(){if(err)return;var a=S.auds.find(function(x){return x.id===a0.id;});a.sync=a.sync||{aud:false,files:{}};
      var p1=a.sync.aud?Promise.resolve():DB.get("blob","pdf_"+a.id).then(function(pdf){return b64(pdf);}).then(function(pdf64){setProg("Subiendo "+a.formato.nombre+"…",total?Math.round(hecho/total*100):0);
          var datos=clone(a);delete datos.sync;return post({action:"auditoria",auditoria:datos,pdf:pdf64});})
        .then(function(r){if(r){a.sync.aud=true;a.sync.pdfUrl=r.pdfUrl;}paso("Datos y PDF subidos");return guardarAud(a);});
      var archivos=(a.fotos||[]).map(function(p,ix){return {id:p.id,nombre:nombreFoto(a,p,ix),mime:"image/jpeg"};});if(a.firma)archivos.push({id:a.firma.id,nombre:"firma_auditado.png",mime:"image/png"});
      archivos.forEach(function(fi){p1=p1.then(function(){if(a.sync.files[fi.id]){paso("");return;}
        return DB.get("blob",fi.id).then(function(b){if(!b){a.sync.files[fi.id]=true;return;}return b64(b).then(function(d){return post({action:"archivo",auditId:a.id,nombre:fi.nombre,mime:fi.mime,data:d});}).then(function(){a.sync.files[fi.id]=true;});})
          .then(function(){paso("Subiendo fotos…");return guardarAud(a);});});});
      return p1.then(function(){a.sync.ok=true;a.sync.fecha=new Date().toISOString();return guardarAud(a);});}).catch(function(e){err=e;});});
  notas.forEach(function(n){chain=chain.then(function(){if(err)return;return post({action:"nota",nota:n}).then(function(){n.synced=true;paso("Notas subidas");return DB.put("notas",n);});}).catch(function(e){err=e;});});
  chain.then(function(){S.syncing=false;S.prog="";
    if(err)toast("La sincronización se interrumpió: "+(err.message||"sin conexión")+". Lo que alcanzó a subir quedó guardado; vuelva a tocar Sincronizar.",6000);
    else{S.lastSync=new Date().toISOString();DB.put("kv",S.lastSync,"lastSync");toast(pendientes.length?"Listo: "+pendientes.length+" auditoría(s) en Drive.":"Formatos y personal actualizados.",4000);}

function liberarEspacio(){var lim=Date.now()-30*864e5,n=0,chain=Promise.resolve();

  if(S.view==="ver"){if(act==="pdf")return descargarPDF();if(act==="nota")return agregarNota();return;}
  if(!S.aud||S.aud.estado==="finalizada")return;
  if(act==="area"){S.area=+b.dataset.c;renderTabs();renderItems();var t=$("#tabs");if(t)window.scrollTo({top:t.offsetTop-70});return;}
  if(act==="resp"){var i=+b.dataset.i,key=k(S.area,i);var ta=document.getElementById("obs_"+key);if(ta)S.aud.obs[key]=ta.value;
    S.aud.resp[key]=(S.aud.resp[key]===b.dataset.v)?"":b.dataset.v;if(!S.aud.resp[key])delete S.aud.resp[key];refrescarItem(i);renderTabs();dock();guardarBorrador();
    var op=opciones(S.aud.formato).find(function(x){return x.t===S.aud.resp[key];});if(op&&op.v!==null&&op.v<1){var t2=document.getElementById("obs_"+key);if(t2&&!t2.value)t2.focus({preventScroll:true});}return;}
  if(act==="obs"){var i2=+b.dataset.i;S.aud.obsAbierta=k(S.area,i2);refrescarItem(i2);var t3=document.getElementById("obs_"+k(S.area,i2));if(t3)t3.focus();return;}
  if(act==="foto")return pedirFoto(+b.dataset.c,+b.dataset.i);
  if(act==="quitarfoto"){var p=S.aud.fotos[+b.dataset.ix];S.aud.fotos.splice(+b.dataset.ix,1);DB.del("blob",p.id);guardarAud(S.aud).then(function(){renderThumbs(p.c,p.i);});toast("Foto quitada");return;}
  if(act==="limpiarfirma")return initSig();if(act==="finalizar")return finalizar();
  if(act==="cancelconfirm"){S.confirm=null;$("#confirmHost").innerHTML="";return;}
  if(act==="descartar"){if(S.confirm!=="del"){S.confirm="del";$("#confirmHost").innerHTML='<div class="confirm"><b>¿Eliminar este borrador?</b><p>Se borran sus respuestas y fotos. Solo los borradores se pueden eliminar.</p><div class="row"><button type="button" class="danger" data-act="descartar">Sí, eliminar</button><button type="button" data-act="cancelconfirm">Cancelar</button></div></div>';$("#confirmHost").scrollIntoView({block:"center"});return;}
    var a=S.aud;Promise.all((a.fotos||[]).map(function(x){return DB.del("blob",x.id);})).then(function(){return DB.del("aud",a.id);}).then(function(){S.auds=S.auds.filter(function(x){return x.id!==a.id;});S.aud=null;toast("Borrador eliminado");go("inicio");});return;}});
document.addEventListener("input",function(e){var t=e.target;if(S.view!=="auditar"||!S.aud||S.aud.estado==="finalizada")return;
  if(t.dataset.meta){S.aud.meta[t.dataset.meta]=t.value;if(t.dataset.meta==="funcionario"){var fi=$("#firmante");if(fi&&!S.aud.firmante)fi.value=t.value;}guardarBorrador();}
  else if(t.dataset.extra){S.aud.meta.extra=S.aud.meta.extra||{};S.aud.meta.extra[t.dataset.extra]=t.value;guardarBorrador();}
  else if(t.dataset.obs){S.aud.obs[t.dataset.obs]=t.value;guardarBorrador();}
  else if(t.dataset.colitem){S.aud.colItem=S.aud.colItem||{};S.aud.colItem[t.dataset.colitem]=t.value;guardarBorrador();}
  else if(t.dataset.gen){S.aud.obsGeneral=t.value;guardarBorrador();}
  else if(t.id==="firmante"){S.aud.firmante=t.value;guardarBorrador();}});
document.addEventListener("change",function(e){var t=e.target;if(S.view!=="auditar"||!S.aud)return;
  if(t.dataset.meta){S.aud.meta[t.dataset.meta]=t.value;guardarBorrador();}
  else if(t.dataset.colitem){S.aud.colItem=S.aud.colItem||{};S.aud.colItem[t.dataset.colitem]=t.value;guardarBorrador();}
  else if(t.dataset.extra){S.aud.meta.extra=S.aud.meta.extra||{};S.aud.meta.extra[t.dataset.extra]=t.value;guardarBorrador();}});
boot();
})();
</script>
</body>
